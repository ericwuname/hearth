name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # D-91（2026-10-02, traecode）：**工具链钉版**——版本必须与仓库根
      # `rust-toolchain.toml` 的 `channel` 一致（由
      # `crates/codex-cli/tests/toolchain_pin_gate.rs` 强制）。
      # **不要改回 `@stable` / `@nightly`**：那会让 CI 跟最新发行漂移，造成
      # "本地绿、CI 红、且本地不可复现"——2026-10-01 stable 1.98→1.99 时实测过
      # 一次（新增 `clippy::double_must_use` 命中 async-trait 宏产物）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 门禁作用域（docs/core-revalidation/decision-status.md「测试环境模板」）：
      # `cargo test` 的作用域要求 **cgroup 可用**且 **不设** HEARTH_ALLOW_NO_CGROUP
      # —— 后者与 sandbox 的 `test_rt4_cgroup_fail_closed` 互斥（会把 fail-closed 短路）。
      # GitHub runner 默认 /sys/fs/cgroup 对非 root 不可写 → LinuxSandbox 在 RT4
      # fail-closed 处 Err → 所有"要真跑 bash"的用例全红（P1-07 实测 4 例）。
      # 故在此建 delegation 子树并启用 memory/pids/cpu 控制器，复刻 VM 门禁口径。
      - name: sandbox cgroup delegation (gate scope)
        run: |
          set -euxo pipefail
          base=/sys/fs/cgroup/hearth
          sudo mkdir -p "$base"
          # 必须 **递归** chown：cgroup 目录在创建时就已生成 cgroup.subtree_control /
          # cgroup.procs 等伪文件，其 inode 属主是 root；只 chown 目录本身改不动它们
          # （实测非递归 → 写 subtree_control 报 Permission denied）。
          sudo chown -R "$(id -u):$(id -g)" "$base"
          # 根 cgroup 已由 systemd 启用全部控制器；这里确保 memory/pids/cpu 下发到子树。
          echo "+memory +pids +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
          echo "+memory +pids +cpu" | tee "$base/cgroup.subtree_control"
          echo "HEARTH_CGROUP_BASE=$base" >> "$GITHUB_ENV"
          echo "--- 诊断：hearth 可用控制器 ---"
          cat "$base/cgroup.controllers"
          echo "--- 诊断：hearth 已下发控制器 ---"
          cat "$base/cgroup.subtree_control"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace -- --nocapture

      # v13 S2: the 4th gate — wiring assertions (anti-regression firewall).
      # Any red break (a locked capability regressed) fails the build.
      # NOTE: the old `cargo test -p telemetry` eval step was removed — the
      # telemetry crate no longer exists in the workspace (step always failed).
      - name: xray wiring
        run: cargo run -p project-xray --bin codex-xray -- wiring --root . --spec docs/xray/wiring-v13.toml

      - name: xray scan
        run: cargo run -p project-xray --bin codex-xray -- scan --root . --out xray-out/facts.json
