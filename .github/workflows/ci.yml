name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # D-91（2026-10-02, traecode）：**工具链钉版**——版本必须与仓库根
      # `rust-toolchain.toml` 的 `channel` 一致（由
      # `crates/codex-cli/tests/toolchain_pin_gate.rs` 强制）。
      # **不要改回 `@stable` / `@nightly`**：那会让 CI 跟最新发行漂移，造成
      # "本地绿、CI 红、且本地不可复现"——2026-10-01 stable 1.98→1.99 时实测过
      # 一次（新增 `clippy::double_must_use` 命中 async-trait 宏产物）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # D-127（2026-10-02, traecode）：以下构建/测试步骤一律带 `--locked`——
      # 让 `Cargo.lock` 与 `Cargo.toml` 不一致时**直接失败**，而不是被 cargo 默认
      # 静默重写（"本地全绿但锁其实已漂移"＝可复现性受损；实测 P1-90 漏提交锁时就是这样）。
      # 由 `crates/codex-cli/tests/toolchain_pin_gate.rs::ci_cargo_steps_are_locked` 强制。
      # 例外：`cargo fmt` 不接受 `--locked`。
      #
      # 门禁作用域（docs/core-revalidation/decision-status.md「测试环境模板」）：
      # `cargo test` 的作用域要求 **cgroup 可用**且 **不设** HEARTH_ALLOW_NO_CGROUP
      # —— 后者与 sandbox 的 `test_rt4_cgroup_fail_closed` 互斥（会把 fail-closed 短路）。
      # GitHub runner 默认 /sys/fs/cgroup 对非 root 不可写 → LinuxSandbox 在 RT4
      # fail-closed 处 Err → 所有"要真跑 bash"的用例全红（P1-07 实测 4 例）。
      # 故在此建 delegation 子树并启用 memory/pids/cpu 控制器，复刻 VM 门禁口径。
      - name: sandbox cgroup delegation (gate scope)
        run: |
          set -euxo pipefail
          base=/sys/fs/cgroup/hearth
          sudo mkdir -p "$base"
          # 必须 **递归** chown：cgroup 目录在创建时就已生成 cgroup.subtree_control /
          # cgroup.procs 等伪文件，其 inode 属主是 root；只 chown 目录本身改不动它们
          # （实测非递归 → 写 subtree_control 报 Permission denied）。
          sudo chown -R "$(id -u):$(id -g)" "$base"
          # 根 cgroup 已由 systemd 启用全部控制器；这里确保 memory/pids/cpu 下发到子树。
          echo "+memory +pids +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
          echo "+memory +pids +cpu" | tee "$base/cgroup.subtree_control"
          echo "HEARTH_CGROUP_BASE=$base" >> "$GITHUB_ENV"
          echo "--- 诊断：hearth 可用控制器 ---"
          cat "$base/cgroup.controllers"
          echo "--- 诊断：hearth 已下发控制器 ---"
          cat "$base/cgroup.subtree_control"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --locked --workspace -- --nocapture

      # v13 S2: the 4th gate — wiring assertions (anti-regression firewall).
      # Any red break (a locked capability regressed) fails the build.
      # NOTE: the old `cargo test -p telemetry` eval step was removed — the
      # telemetry crate no longer exists in the workspace (step always failed).
      - name: xray wiring
        run: cargo run --locked -p project-xray --bin codex-xray -- wiring --root . --spec docs/xray/wiring-v13.toml

      - name: xray scan
        run: cargo run --locked -p project-xray --bin codex-xray -- scan --root . --out xray-out/facts.json

  # M0 / D-222（2026-10-18, traecode）：**判据不得恒真**。
  # 背景（实测）：修复前 20 个任务的 verify.sh 里，T02 两个分支都打印 VERIFY_PASS、T03
  # 无条件打印，退出码恒 0；而 runner 的判定是「输出含 VERIFY_PASS」——忽略退出码。
  # 后果：T03 在 `test result: FAILED. 0 passed; 2 failed` 的情况下仍被记为「成功」。
  # 本 job 复刻 runner 的真实执行协议（fixture 摊平到工作区 + verify.sh 落为 __verify.sh），
  # 断言「未做任何修复的 fixture 必须判失败」（20/20），并用 T03 的**已知正解**做反向对照
  # （做对了必须判通过）——两个方向都堵，防止有人把判据改成「永远失败」来蒙混过关。
  #
  # 独立成 job（而非并入 check）的理由：它需要 `bash` + 真实 `cargo build` 20 个 fixture，
  # 与工作区门禁的 cgroup/超时口径不同，混在一起会互相拖累。
  bench-judge:
    name: bench judge (no fail-open)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 刻意清空 RUSTFLAGS：fixture 不属于本工作区，不应继承 `-D warnings`
    # （否则 fixture 里的普通 warning 会被升格为构建失败，污染判据口径）。
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      # D-227：held-out 实例**不入库**（公开仓放上去就等于公开），按种子现场生成；
      # 生成器与种子约定入库 ⇒ 可复现、可审计（GENESIS.json 记录 seed/count/家族）。
      - name: 生成 held-out 实例（种子 20261018 × 8）
        run: python3 bench/gen_heldout.py --seed 20261018 --count 8

      - name: 判据双向门禁 · 公开集（未修复必判失败 + 参考解必判通过 + 覆盖率不得回退）
        run: REQUIRE_FULL_COVERAGE=1 bash bench/tests/pristine_must_fail.sh

      # 同一套判据、换根复用：held-out 集也必须满足"未修复必判失败 + 参考解必判通过"。
      - name: 判据双向门禁 · held-out 集
        env:
          BENCH_TASKS_ROOT: ${{ github.workspace }}/bench/tasks-heldout
          BENCH_SOLUTIONS_ROOT: ${{ github.workspace }}/bench/solutions-heldout
          REQUIRE_FULL_COVERAGE: "1"
        run: bash bench/tests/pristine_must_fail.sh

      - name: 判定口径与元数据 schema 单测
        run: python3 -m unittest discover -s bench/tests -p "test_*.py" -v
