# ── v19.0 S3: 经验自适应开关 ─────────────────────────────
[[capability]]
id = "experience-adaptive-switch"
claim = "经验注入自适应门控（consecutive_errors>=3）已退役——线C手术 D-9 删除该条件（B 臂 do_reflect 维护者随相位机拆除，D-7 起恒 0 死分支）；experience_store 机制本体保留（set_experience_store 在位，A 臂行为零变化）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["experience_store", "set_experience_store"]
