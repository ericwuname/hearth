# wiring-v13.toml — 接线断言规格（A3 修正：**16 能力断言 / 27 调用链**；v13 起"7 条"为旧口径，
# v22 加 replay-provider-wired 后为 15，v0.2.2 天赋增 talent-style-injected 后为 16。
# 2026-09-30 订正（traecode）：原头部写"15 / 24"为旧口径漏更新，实测为 16 / 27。）
# 注：其中 2 条（sub-budget-not-halved / no-toolcalls-requires-write）已于 2026-09-30 登记为
# severity=yellow（能力随 R9 线C手术 D-4/D-8 退役，**留痕不阻断**，待顶层追认）——见各自条目注释。
#
# 语义：每条 capability 是一条调用链；每环指向一个文件，
#   all = 全部子串必须命中（AND）；any = 至少一个子串命中（OR）。
# 任一环不通 = 能力断裂；severity=red 的断裂 → codex-xray wiring exit 1。
#
# 为什么存在：v10.3 修好 constitution 注入 → v11.4 无声改坏（首例回归）。
# v12.7 的三项修复（tool 回写 / 只读视图 / 下标配对）价值极高，必须物理锁死。
#
# 格式为 TOML 而非 YAML：toml 已是 workspace 依赖（零新增），
# VM 上 github 不可达，任何新编译期依赖都是风险（forge-v13-plan §3.1）。

schema = 1

# ── v12.7 修复 #1：工具结果回写对话 ──────────────────────────────
[[capability]]
id = "tool-exchange-wired"
claim = "record_tool_exchange 在 Act 后仍被调用（工具结果回写 assistant/tool 消息对）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["self.record_tool_exchange();"]
meaning = "do_act 路径上的调用点仍在"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["fn record_tool_exchange"]
meaning = "函数体未被删除"

# ── v12.7 修复 #2：子智能体只读视图 ──────────────────────────────
[[capability]]
id = "readonly-view-strips"
claim = "read_only_view 仍剥离全部写工具（write_file/edit/apply_patch/bash）"
severity = "red"

[[capability.chain]]
file = "crates/tool-runtime/src/dispatcher.rs"
all = ["MUTATING_TOOLS", "\"write_file\"", "\"edit\"", "\"apply_patch\"", "\"bash\""]
meaning = "剥离清单完整（少一个都算断）"

[[capability.chain]]
file = "crates/tool-runtime/src/dispatcher.rs"
any = ["fn read_only_view"]
meaning = "只读视图构造函数仍在"

[[capability]]
id = "subagent-uses-readonly"
claim = "spawn_sub_agent 仍然拿只读分发器（子智能体不能写文件）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["read_only_view()"]
meaning = "子智能体构造处调用只读视图"

# ── v12.7 修复 #3：按下标配对（不信 provider 的 call_id） ────────
[[capability]]
id = "tool-exchange-pairing"
claim = "工具调用与结果按下标配对（provider 缺 call_id 也不错位）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["for (i, call) in calls.iter().enumerate()"]
meaning = "下标配对循环仍在"

# ── v12.6/v12.7：自验证指令在 system prompt 里 ───────────────────
# 2026-09-30 锚点同步（traecode）：原 all = ["cargo test", "COMPILER ERRORS"] 断裂——
# "COMPILER ERRORS" 是 B 臂机关块里的字符串，随 R9 线C手术 D-8 一并删除（现已全仓 0 处代码命中，
# 仅存于历史文档）。**能力本体仍在**：loop.rs:2334 的 system prompt 仍在强制 cargo test 自验证
# 并明确"非零退出=失败、未验证不得宣称完成"。故原地改锚其现役原文，claim 据实收窄。
#
# 【第 2 环来源】原"编译错误指引"语义现下沉到 bash 工具层的 read_lints 结构化提取
# （bash.rs:690）。此前该环曾被撤回——原因是接线引擎的剥离器不跟踪字符串状态，
# bash.rs 内字符串中的 `/*` 被误判为块注释开头，全文件 79% 被吞（43132→9081 字节），
# 该文件上一切锚点**假报缺失**。该引擎缺陷（D-12）已修复（引入字符串/原始字符串/
# 字符字面量词法状态），故本环**重新挂回**。
[[capability]]
id = "self-verify-in-prompt"
claim = "system prompt 仍强制 cargo test 自验证；编译错误结构化提取已下沉至 bash 工具层"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["cargo test", "never claim what you did not verify"]
meaning = "system prompt 自验证 workflow 仍在（loop.rs:2334）"

[[capability.chain]]
file = "crates/tools-builtin/src/bash.rs"
any = ["编译错误结构化提取（read_lints）"]
meaning = "原 loop.rs 的 COMPILER ERRORS 指引已下沉到 bash 工具层（bash.rs:690）"

# ── v13 S3-a：constitution 运行时读文件（锁死 v11.4 式回归） ─────
# 2026-09-30 锚点同步（traecode）：第 2 环原锚定 loop.rs 的 `constitution::constitution_prompt()`
# ——该调用点已随 hearth-slim S3（c343031 §二.1）**有意移除**：宪法全文出注入层（3.5K→0，
# 真机实证为 prompt 肥胖元凶），语义降级为投影层保留，**constitution.rs 模块本体保留**。
# 故第 1 环（运行时读 constitution.md）原样保留，第 2 环改锚模块本体的函数签名，
# claim 据实收窄——不再声称"仍注入 build_messages"（那已不成立）。
[[capability]]
id = "constitution-reads-file"
claim = "宪法从 constitution.md 运行时读取（读取函数在位；注入 system prompt 已随 hearth-slim S3 退役）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/constitution.rs"
all = ["read_to_string", "constitution.md"]
meaning = "运行时文件读取逻辑存在（constitution.rs:49/:71）"

[[capability.chain]]
file = "crates/agent-core/src/constitution.rs"
any = ["pub fn constitution_prompt() -> String {"]
meaning = "运行时读文件函数本体仍在（constitution.rs:35）；注入 prompt 的调用点已删"

# ── v13 S3-b：civ 自动写入（清掉'从未接线'的五版旧债） ───────────
[[capability]]
id = "civ-auto-written"
claim = "do_reflect/do_observe 自动写文明线（CivWriter 全链接通）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["pub trait CivWriter", "self.civ_writer"]
meaning = "trait 定义 + loop 内调用点"

[[capability.chain]]
file = "crates/agent-runtime/src/session.rs"
any = ["set_civ_writer("]
meaning = "SessionManager 注入每个 AgentLoop"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["CivWriterAdapter", "set_civ_writer("]
meaning = "组合根把 CivilizationStore 适配进来"

# ── v16.0 S1: experience 持久化 ─────────────────────────────
[[capability]]
id = "experience-persists"
claim = "ExperienceStore 有 JSONL 文件持久化（set_path + append_to_disk）"
severity = "red"

[[capability.chain]]
file = "crates/experience/src/lib.rs"
all = ["fn set_path", "fn append_to_disk"]
meaning = "持久化方法存在"

[[capability.chain]]
file = "crates/service/src/main.rs"
any = ["set_path", "experience.jsonl"]
meaning = "组合根在启动时设定了持久化路径"

# ── v16.0 S2: CostGuard 真值接地 ─────────────────────────────
[[capability]]
id = "cost-guard-live"
claim = "GuardContext.cost_ratio 从 NervousSystem 真实读取"
severity = "red"

[[capability.chain]]
file = "crates/nervous-system/src/lib.rs"
all = ["fn cost_ratio"]
meaning = "NervousSystem 有归一化成本比率输出"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["cost_ratio: self.nervous.cost_ratio()"]
meaning = "loop.rs 用真实 cost_ratio 替代硬编码 0.0"

[[capability.chain]]
file = "crates/subconscious/src/lib.rs"
all = ["impl SubconsciousGuard for CostGuard"]
meaning = "CostGuard 仍为有效守卫"

# ── v19.0 S3: 经验自适应开关 ─────────────────────────────
[[capability]]
id = "experience-adaptive-switch"
claim = "经验注入自适应门控（consecutive_errors>=3）已退役——线C手术 D-9 删除该条件（B 臂 do_reflect 维护者随相位机拆除，D-7 起恒 0 死分支）；experience_store 机制本体保留（set_experience_store 在位，A 臂行为零变化）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["experience_store", "set_experience_store"]
meaning = "机制本体保留（注入门控已退役——锚点更新至现状，S5/C-1 规格同步）"

# ── v20.0 S1: planner all_done 需要真实 Write 节点 ─────────────
# 2026-09-30 收窄（traecode）：原锚 `["write_attempted", "needs_decompose = true"]` 断裂——
# 这两个标识现已**仅存于注释**：`write_attempted` 置位与 `needs_decompose` 强制 replan
# 均随 R9 线C手术 D-4/D-9 删除（loop.rs:2879 注释载"all_done 门已随 TaskGraph 删除——
# 完成判定收敛到 run() Done 相位的确定性核验，判定权归模型、护栏只剩预算与核验"）。
#
# **作用域已收窄**：通用 Done 出口**不再**要求"必须有真实写盘"；此处改锚**现役存活**的
# 完成相位产物核验（completion_fact_check：产物为空即拒绝），把这条仍在的防线锁住。
# ⚠️ 通用"无写即 replan"保证已退役——如需恢复须单独立卡（属产品决策，非本卡范围）。
[[capability]]
id = "all-done-requires-write"
claim = "【作用域已收窄】完成相位仍对产物做确定性核验（产物为空即拒绝，completion_fact_check）；通用 Done 出口的『必须有真实写盘』要求已随 D-4/D-9 退役"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["completion_fact_check", "no artifact written this run"]
meaning = "完成事实核验仍在：written_files 为空 → 拒绝 Done（loop.rs:3844-3847）"

# ── v20.0 S3: 经验遗忘机制部署 ─────────────────────────────
[[capability]]
id = "experience-prune-wired"
claim = "observer 每小时巡检执行 experience prune + upgrade_core（遗忘机制已部署，非死代码）"
severity = "red"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["observer_experience.prune(0.3, 90)", "observer_experience.upgrade_core()"]
meaning = "组合根 observer 任务真实调用遗忘函数"
# 引擎是子串存在性断言，锚定"新写法必须在"：一旦被改回 /2，
# saturating_sub(2).max(8) 消失 → 断裂 → RED。
#
# 2026-09-30 退役登记（traecode）：该锚**已断裂**——`parent_max_steps.saturating_sub(2).max(8)`
# 全仓 0 处代码命中。图驱动委派随 R9 线C手术 **D-4** 删除（loop.rs:2870 注释载"图驱动委派
# （delegable 节点 → 子代理）已随 TaskGraph 删除——spawn 块不可达"），`spawn_sub_agent`
# 现**无任何调用者**（死代码）。**本项无存活锚点可收窄**。
#
# 处置：保留条目**留痕**（不删——`==16` 条数断言正是为"防删条"而设），
# `severity` 降为 `yellow`（引擎仅对 `red` 阻断，见 `has_red_break`）**不阻断门禁**，
# claim 如实登记退役。**待顶层追认**。若该写法日后回归，本项将自动转绿。
[[capability]]
id = "sub-budget-not-halved"
claim = "【已退役·待顶层追认】子代理委派路径随 D-4 删除，原 `(parent-2).max(8)` 预算公式已消失；`spawn_sub_agent` 仅存 API 且无调用者"
severity = "yellow"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["parent_max_steps.saturating_sub(2).max(8)"]
meaning = "（历史锚点，已失效——保留留痕：该写法一旦回归即自动转绿）"

# ── v22.0: 双 Done 出口都要求真实 Write ─────────────
# 2026-09-30 退役登记（traecode）：该锚**已断裂**——`"no tool_calls but NO write executed"`
# 与 `needs_decompose = true` 全仓 0 处命中。no-tool_calls 分支已坍缩为**直接 Done**
# （loop.rs:3311-3314），同段注释明载"框架不再 forced-replan、不再 write-required 逼写、
# 不再『You MUST use tool_calls』"（R9 线C手术 **D-8** 删除 B 臂机关）。
# **本项无存活锚点可收窄**（现役分支的语义与本项**相反**，绝不可改锚到它）。
#
# 处置同 `sub-budget-not-halved`：保留条目留痕、`severity` 降 `yellow` 不阻断、
# claim 如实登记退役。**待顶层追认**。
[[capability]]
id = "no-toolcalls-requires-write"
claim = "【已退役·待顶层追认】no tool_calls 出口的写盘门控已随 D-8 删除；该分支现直接 Done（loop.rs:3311-3314）"
severity = "yellow"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["no tool_calls but NO write executed", "needs_decompose = true"]
meaning = "（历史锚点，已失效——保留留痕：绝不改锚到现役的『不写即 Done』分支）"

# ── v15 线B：确定性回放 provider 必须真接线到组合根 ─
# 只定义 crate 不注册 = 回放门是空壳；这条钉死"注册进 registry"这一步。
[[capability]]
id = "replay-provider-wired"
claim = "ReplayProvider 实现 LlmProvider 并由组合根按 REPLAY_DIR 注册为 'replay'"
severity = "red"

[[capability.chain]]
file = "crates/llm-replay/src/lib.rs"
all = ["impl LlmProvider for ReplayProvider", "fn load_dir"]
meaning = "provider 本体存在且可从 fixture 目录加载"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["REPLAY_DIR", "llm_replay::ReplayProvider::load_dir", "registry.register"]
meaning = "组合根真的把它注册进 registry（不是只定义不接线）"

# ── v0.2.2 天赋基因：认知风格注入 + 核心电路接线 ─
# （docs/hearth-meta-capability-genes-final.md：6 核心电路 + 13 认知风格 + 调度器）
[[capability]]
id = "talent-style-injected"
claim = "天赋调度器按任务分类注入认知风格偏置（G3），核心电路 wiring 断言启动期执行"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/talent.rs"
all = ["pub fn style_for", "pub fn inject_text", "pub fn core_circuit_wiring", "CORE_CIRCUIT"]
meaning = "天赋模块存在：分类器/注入器/核心电路断言/常驻清单"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["talent::style_for", "talent::inject_text", "talent::core_circuit_wiring"]
meaning = "build_messages 注入风格段 + new() 启动期跑 wiring 断言（真接线非空壳）"
