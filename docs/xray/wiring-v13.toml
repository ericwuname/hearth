# ── v20.0 S1: planner all_done 需要真实 Write 节点 ─────────────
# 2026-09-30 收窄（traecode）：原锚 `["write_attempted", "needs_decompose = true"]` 断裂——
# 这两个标识现已**仅存于注释**：`write_attempted` 置位与 `needs_decompose` 强制 replan
# 均随 R9 线C手术 D-4/D-9 删除（loop.rs:2879 注释载"all_done 门已随 TaskGraph 删除——
# 完成判定收敛到 run() Done 相位的确定性核验，判定权归模型、护栏只剩预算与核验"）。
#
# **作用域已收窄**：通用 Done 出口**不再**要求"必须有真实写盘"；此处改锚**现役存活**的
# 完成相位产物核验（completion_fact_check：产物为空即拒绝），把这条仍在的防线锁住。
# ⚠️ 通用"无写即 replan"保证已退役——如需恢复须单独立卡（属产品决策，非本卡范围）。
[[capability]]
id = "all-done-requires-write"
claim = "【作用域已收窄】完成相位仍对产物做确定性核验（产物为空即拒绝，completion_fact_check）；通用 Done 出口的『必须有真实写盘』要求已随 D-4/D-9 退役"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["completion_fact_check", "no artifact written this run"]
meaning = "完成事实核验仍在：written_files 为空 → 拒绝 Done（loop.rs:3844-3847）"

# ── v20.0 S3: 经验遗忘机制部署 ─────────────────────────────
[[capability]]
id = "experience-prune-wired"
claim = "observer 每小时巡检执行 experience prune（遗忘机制已部署，非死代码）"
severity = "red"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["observer_per_user.all_experience()", "st.prune(0.3, 90)"]
meaning = "组合根 observer 任务真实调用遗忘函数（D-175 起**逐 per-user 档**剪枝）"
# 2026-10-08 复算（D-175，traecode）：锚点随「经验库按租户分区」同步——全局单例的
# `observer_experience.prune(0.3, 90)` 改为**逐 per-user 档**遍历剪枝
# （`observer_per_user.all_experience()` + `st.prune(0.3, 90)`）。若只剪（已不再被会话写入的）
# 全局单例，则**真档（per-user）永不被剪** ⇒ 遗忘机制失效——本锚正是为防这种"接线漂移"而设。
# **能力不变（prune 仍每小时真实执行）、条数仍 16、severity 仍 red**——纯锚点/文案同步。
# （旧写法 `observer_experience.prune(0.3, 90)` 已全仓消失，故**不**留作历史锚点——那会恒红。）
# 2026-10-02 收窄（D-107，traecode）：本项原含第二环锚点
# `observer_experience.upgrade_core()`，claim 也写作 "prune + upgrade_core"。
# 但 `upgrade_core()` 的过滤条件依赖 `Experience.reference_count`，而该字段
# **无任何写入方**（唯一自增点 `search()` 已随 D-47 删除）⇒ 该查询恒返回空、
# 调用点仅把"0"打进一条日志。D-100 裁决（联网核实 Reflexion/OEP + 本仓 v17/v18
# 实测）后按 D-72 先例**退役复用接口**：`reference_count` / `reuse_rate` /
# `upgrade_core()` 一并删除，经验库定位为**只写审计档**。
# 故锚点收窄为**真实生效的剪枝**（prune 仍每小时执行、真实删除旧弱条目）；
# severity 仍为 red，条数仍为 16（本项未删条，只是把死锚点换掉）。
# 引擎是子串存在性断言，锚定"新写法必须在"：一旦被改回 /2，
# saturating_sub(2).max(8) 消失 → 断裂 → RED。
#
# 2026-09-30 退役登记（traecode）：该锚**已断裂**——`parent_max_steps.saturating_sub(2).max(8)`
# 全仓 0 处代码命中。图驱动委派随 R9 线C手术 **D-4** 删除（loop.rs:2870 注释载"图驱动委派
# （delegable 节点 → 子代理）已随 TaskGraph 删除——spawn 块不可达"），`spawn_sub_agent`
# 现**无任何调用者**（死代码）。**本项无存活锚点可收窄**。
#
# 处置：保留条目**留痕**（不删——`==16` 条数断言正是为"防删条"而设），
# `severity` 降为 `yellow`（引擎仅对 `red` 阻断，见 `has_red_break`）**不阻断门禁**，
# claim 如实登记退役。**顶层已追认（2026-10-01，裁决5）**。若该写法日后回归，本项将自动转绿。
[[capability]]
id = "sub-budget-not-halved"
claim = "【已退役·顶层已追认】子代理委派路径随 D-4 删除，原 `(parent-2).max(8)` 预算公式已消失；`spawn_sub_agent` 仅存 API 且无调用者"
severity = "yellow"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["parent_max_steps.saturating_sub(2).max(8)"]
meaning = "（历史锚点，已失效——保留留痕：该写法一旦回归即自动转绿）"

# ── v22.0: 双 Done 出口都要求真实 Write ─────────────
# 2026-09-30 退役登记（traecode）：该锚**已断裂**——`"no tool_calls but NO write executed"`
# 与 `needs_decompose = true` 全仓 0 处命中。no-tool_calls 分支已坍缩为**直接 Done**
# （loop.rs:3311-3314），同段注释明载"框架不再 forced-replan、不再 write-required 逼写、
# 不再『You MUST use tool_calls』"（R9 线C手术 **D-8** 删除 B 臂机关）。
# **本项无存活锚点可收窄**（现役分支的语义与本项**相反**，绝不可改锚到它）。
#
# 处置同 `sub-budget-not-halved`：保留条目留痕、`severity` 降 `yellow` 不阻断、
# claim 如实登记退役。**顶层已追认（2026-10-01，裁决5）**。
[[capability]]
id = "no-toolcalls-requires-write"
claim = "【已退役·顶层已追认】no tool_calls 出口的写盘门控已随 D-8 删除；该分支现直接 Done（loop.rs:3311-3314）"
severity = "yellow"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["no tool_calls but NO write executed", "needs_decompose = true"]
meaning = "（历史锚点，已失效——保留留痕：绝不改锚到现役的『不写即 Done』分支）"

