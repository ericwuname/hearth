# wiring-v13.toml — 接线断言规格（A3 修正：15 能力断言 / 24 调用链；v13 起"7 条"为旧口径，v22 加 replay-provider-wired 后 15）
#
# 语义：每条 capability 是一条调用链；每环指向一个文件，
#   all = 全部子串必须命中（AND）；any = 至少一个子串命中（OR）。
# 任一环不通 = 能力断裂；severity=red 的断裂 → codex-xray wiring exit 1。
#
# 为什么存在：v10.3 修好 constitution 注入 → v11.4 无声改坏（首例回归）。
# v12.7 的三项修复（tool 回写 / 只读视图 / 下标配对）价值极高，必须物理锁死。
#
# 格式为 TOML 而非 YAML：toml 已是 workspace 依赖（零新增），
# VM 上 github 不可达，任何新编译期依赖都是风险（forge-v13-plan §3.1）。

schema = 1

# ── v12.7 修复 #1：工具结果回写对话 ──────────────────────────────
[[capability]]
id = "tool-exchange-wired"
claim = "record_tool_exchange 在 Act 后仍被调用（工具结果回写 assistant/tool 消息对）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["self.record_tool_exchange();"]
meaning = "do_act 路径上的调用点仍在"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["fn record_tool_exchange"]
meaning = "函数体未被删除"

# ── v12.7 修复 #2：子智能体只读视图 ──────────────────────────────
[[capability]]
id = "readonly-view-strips"
claim = "read_only_view 仍剥离全部写工具（write_file/edit/apply_patch/bash）"
severity = "red"

[[capability.chain]]
file = "crates/tool-runtime/src/dispatcher.rs"
all = ["MUTATING_TOOLS", "\"write_file\"", "\"edit\"", "\"apply_patch\"", "\"bash\""]
meaning = "剥离清单完整（少一个都算断）"

[[capability.chain]]
file = "crates/tool-runtime/src/dispatcher.rs"
any = ["fn read_only_view"]
meaning = "只读视图构造函数仍在"

[[capability]]
id = "subagent-uses-readonly"
claim = "spawn_sub_agent 仍然拿只读分发器（子智能体不能写文件）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["read_only_view()"]
meaning = "子智能体构造处调用只读视图"

# ── v12.7 修复 #3：按下标配对（不信 provider 的 call_id） ────────
[[capability]]
id = "tool-exchange-pairing"
claim = "工具调用与结果按下标配对（provider 缺 call_id 也不错位）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["for (i, call) in calls.iter().enumerate()"]
meaning = "下标配对循环仍在"

# ── v12.6/v12.7：自验证指令在 system prompt 里 ───────────────────
[[capability]]
id = "self-verify-in-prompt"
claim = "system prompt 仍强制 cargo test 自验证 + 编译错误指引"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["cargo test", "COMPILER ERRORS"]
meaning = "自验证 workflow + trait-bound 错误指引都在"

# ── v13 S3-a：constitution 运行时读文件（锁死 v11.4 式回归） ─────
[[capability]]
id = "constitution-reads-file"
claim = "宪法从 constitution.md 运行时读取（非硬编码摘要）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/constitution.rs"
all = ["read_to_string", "constitution.md"]
meaning = "运行时文件读取逻辑存在"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["constitution::constitution_prompt()"]
meaning = "build_messages 仍注入宪法"

# ── v13 S3-b：civ 自动写入（清掉'从未接线'的五版旧债） ───────────
[[capability]]
id = "civ-auto-written"
claim = "do_reflect/do_observe 自动写文明线（CivWriter 全链接通）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["pub trait CivWriter", "self.civ_writer"]
meaning = "trait 定义 + loop 内调用点"

[[capability.chain]]
file = "crates/agent-runtime/src/session.rs"
any = ["set_civ_writer("]
meaning = "SessionManager 注入每个 AgentLoop"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["CivWriterAdapter", "set_civ_writer("]
meaning = "组合根把 CivilizationStore 适配进来"

# ── v16.0 S1: experience 持久化 ─────────────────────────────
[[capability]]
id = "experience-persists"
claim = "ExperienceStore 有 JSONL 文件持久化（set_path + append_to_disk）"
severity = "red"

[[capability.chain]]
file = "crates/experience/src/lib.rs"
all = ["fn set_path", "fn append_to_disk"]
meaning = "持久化方法存在"

[[capability.chain]]
file = "crates/service/src/main.rs"
any = ["set_path", "experience.jsonl"]
meaning = "组合根在启动时设定了持久化路径"

# ── v16.0 S2: CostGuard 真值接地 ─────────────────────────────
[[capability]]
id = "cost-guard-live"
claim = "GuardContext.cost_ratio 从 NervousSystem 真实读取"
severity = "red"

[[capability.chain]]
file = "crates/nervous-system/src/lib.rs"
all = ["fn cost_ratio"]
meaning = "NervousSystem 有归一化成本比率输出"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["cost_ratio: self.nervous.cost_ratio()"]
meaning = "loop.rs 用真实 cost_ratio 替代硬编码 0.0"

[[capability.chain]]
file = "crates/subconscious/src/lib.rs"
all = ["impl SubconsciousGuard for CostGuard"]
meaning = "CostGuard 仍为有效守卫"

# ── v19.0 S3: 经验自适应开关 ─────────────────────────────
[[capability]]
id = "experience-adaptive-switch"
claim = "经验注入受 consecutive_errors>=3 自适应门控（弱模型降级通道，非强模型常驻噪音）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["consecutive_errors >= 3", "store.search"]
meaning = "只有连续失败≥3 才搜索经验注入"

# ── v20.0 S1: planner all_done 需要真实 Write 节点 ─────────────
[[capability]]
id = "all-done-requires-write"
claim = "all_done 判定要求至少一次真实写操作（write_file/edit），否则强制 replan——根治 T13/T19 只读即完成的毒债"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["write_attempted", "needs_decompose = true"]
meaning = "all_done 与 write_attempted 共同门控 Done，无写则 replan"

# ── v20.0 S3: 经验遗忘机制部署 ─────────────────────────────
[[capability]]
id = "experience-prune-wired"
claim = "observer 每小时巡检执行 experience prune + upgrade_core（遗忘机制已部署，非死代码）"
severity = "red"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["observer_experience.prune(0.3, 90)", "observer_experience.upgrade_core()"]
meaning = "组合根 observer 任务真实调用遗忘函数"
# 引擎是子串存在性断言，锚定"新写法必须在"：一旦被改回 /2，
# saturating_sub(2).max(8) 消失 → 断裂 → RED。
[[capability]]
id = "sub-budget-not-halved"
claim = "子代理预算 = (parent-2).max(8)，不再是 max_steps/2（v13 FLAKY 根因）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["parent_max_steps.saturating_sub(2).max(8)"]
meaning = "v14-1 修复写法仍在（被改回 /2 即断裂）"

# ── v22.0: 双 Done 出口都要求真实 Write ─────────────
[[capability]]
id = "no-toolcalls-requires-write"
claim = "no tool_calls 的 Done 出口同样受 write_attempted 门控（T19 第二路径根治：LLM 纯文本决定完成时无写也必须 replan）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["no tool_calls but NO write executed", "needs_decompose = true"]
meaning = "纯文本收尾无写时强制 replan"

# ── v15 线B：确定性回放 provider 必须真接线到组合根 ─
# 只定义 crate 不注册 = 回放门是空壳；这条钉死"注册进 registry"这一步。
[[capability]]
id = "replay-provider-wired"
claim = "ReplayProvider 实现 LlmProvider 并由组合根按 REPLAY_DIR 注册为 'replay'"
severity = "red"

[[capability.chain]]
file = "crates/llm-replay/src/lib.rs"
all = ["impl LlmProvider for ReplayProvider", "fn load_dir"]
meaning = "provider 本体存在且可从 fixture 目录加载"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["REPLAY_DIR", "llm_replay::ReplayProvider::load_dir", "registry.register"]
meaning = "组合根真的把它注册进 registry（不是只定义不接线）"

# ── v0.2.2 天赋基因：认知风格注入 + 核心电路接线 ─
# （docs/hearth-meta-capability-genes-final.md：6 核心电路 + 13 认知风格 + 调度器）
[[capability]]
id = "talent-style-injected"
claim = "天赋调度器按任务分类注入认知风格偏置（G3），核心电路 wiring 断言启动期执行"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/talent.rs"
all = ["pub fn style_for", "pub fn inject_text", "pub fn core_circuit_wiring", "CORE_CIRCUIT"]
meaning = "天赋模块存在：分类器/注入器/核心电路断言/常驻清单"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["talent::style_for", "talent::inject_text", "talent::core_circuit_wiring"]
meaning = "build_messages 注入风格段 + new() 启动期跑 wiring 断言（真接线非空壳）"
