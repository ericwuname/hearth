# wiring-v13.toml — 接线断言规格（A3 修正：**16 能力断言 / 27 调用链**；v13 起"7 条"为旧口径，
# v22 加 replay-provider-wired 后为 15，v0.2.2 天赋增 talent-style-injected 后为 16。
# 2026-09-30 订正（traecode）：原头部写"15 / 24"为旧口径漏更新，实测为 16 / 27。）
# 注：其中 2 条（sub-budget-not-halved / no-toolcalls-requires-write）已于 2026-09-30 登记为
# severity=yellow（能力随 R9 线C手术 D-4/D-8 退役，**留痕不阻断**）——**顶层已于 2026-10-01
# 追认「退役」（裁决5）**，即"这 2 项保证正式作废、不再作为缺口追踪"；见各自条目注释。
#
# 语义：每条 capability 是一条调用链；每环指向一个文件，
#   all = 全部子串必须命中（AND）；any = 至少一个子串命中（OR）。
# 任一环不通 = 能力断裂；severity=red 的断裂 → codex-xray wiring exit 1。
#
# 为什么存在：v10.3 修好 constitution 注入 → v11.4 无声改坏（首例回归）。
# v12.7 的三项修复（tool 回写 / 只读视图 / 下标配对）价值极高，必须物理锁死。
#
# 格式为 TOML 而非 YAML：toml 已是 workspace 依赖（零新增），
# VM 上 github 不可达，任何新编译期依赖都是风险（forge-v13-plan §3.1）。

schema = 1

# ── v12.7 修复 #1：工具结果回写对话 ──────────────────────────────
[[capability]]
id = "tool-exchange-wired"
claim = "record_tool_exchange 在 Act 后仍被调用（工具结果回写 assistant/tool 消息对）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["self.record_tool_exchange();"]
meaning = "do_act 路径上的调用点仍在"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["fn record_tool_exchange"]
meaning = "函数体未被删除"

# ── v12.7 修复 #2：子智能体只读视图 ──────────────────────────────
[[capability]]
id = "readonly-view-strips"
claim = "read_only_view 仍剥离全部写工具（write_file/edit/apply_patch/bash）"
severity = "red"

[[capability.chain]]
file = "crates/tool-runtime/src/dispatcher.rs"
all = ["MUTATING_TOOLS", "\"write_file\"", "\"edit\"", "\"apply_patch\"", "\"bash\""]
meaning = "剥离清单完整（少一个都算断）"

[[capability.chain]]
file = "crates/tool-runtime/src/dispatcher.rs"
any = ["fn read_only_view"]
meaning = "只读视图构造函数仍在"

# 2026-10-01 退役登记（traecode，D-83）：子代理委派子系统（spawn_sub_agent /
# collect_sub_agent_results / active_sub_agent_count / extract_files_from_tool_calls /
# merge_file_changes / RunReport.files_changed）已整段删除——delegable 数据源随 TaskGraph
# 拆除、全仓零调用方。`spawn_sub_agent` 内对 `read_only_view()` 的**唯一生产调用点**随之
# 消失，本环**已断裂**；只读视图构造与剥离清单本体（dispatcher.rs，见上方
# `readonly-view-strips`）仍在，故仅本环退役。
# 处置同 `sub-budget-not-halved`：保留条目留痕（防删条断言 `==16`）、`severity` 降 `yellow`
# 不阻断门禁、claim 如实登记退役。若子代理能力日后重启（见 D-83 注），本项将自动转绿。
[[capability]]
id = "subagent-uses-readonly"
claim = "【已退役·随 D-83】子代理委派子系统已删除，spawn_sub_agent 对只读分发器的调用随之消失；只读视图本体（dispatcher.rs）仍在"
severity = "yellow"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["read_only_view()"]
meaning = "（历史锚点，已失效——保留留痕：子代理能力若重启，该调用回归即自动转绿）"

# ── v12.7 修复 #3：按下标配对（不信 provider 的 call_id） ────────
[[capability]]
id = "tool-exchange-pairing"
claim = "工具调用与结果按下标配对（provider 缺 call_id 也不错位）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["for (i, call) in calls.iter().enumerate()"]
meaning = "下标配对循环仍在"

# ── v12.6/v12.7：自验证指令在 system prompt 里 ───────────────────
# 2026-09-30 锚点同步（traecode）：原 all = ["cargo test", "COMPILER ERRORS"] 断裂——
# "COMPILER ERRORS" 是 B 臂机关块里的字符串，随 R9 线C手术 D-8 一并删除（现已全仓 0 处代码命中，
# 仅存于历史文档）。**能力本体仍在**：loop.rs:2334 的 system prompt 仍在强制 cargo test 自验证
# 并明确"非零退出=失败、未验证不得宣称完成"。故原地改锚其现役原文，claim 据实收窄。
#
# 【第 2 环来源】原"编译错误指引"语义现下沉到 bash 工具层的 read_lints 结构化提取
# （bash.rs:690）。此前该环曾被撤回——原因是接线引擎的剥离器不跟踪字符串状态，
# bash.rs 内字符串中的 `/*` 被误判为块注释开头，全文件 79% 被吞（43132→9081 字节），
# 该文件上一切锚点**假报缺失**。该引擎缺陷（D-12）已修复（引入字符串/原始字符串/
# 字符字面量词法状态），故本环**重新挂回**。
[[capability]]
id = "self-verify-in-prompt"
claim = "system prompt 仍强制 cargo test 自验证；编译错误结构化提取已下沉至 bash 工具层"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["cargo test", "never claim what you did not verify"]
meaning = "system prompt 自验证 workflow 仍在（loop.rs:2334）"

[[capability.chain]]
file = "crates/tools-builtin/src/bash.rs"
any = ["编译错误结构化提取（read_lints）"]
meaning = "原 loop.rs 的 COMPILER ERRORS 指引已下沉到 bash 工具层（bash.rs:690）"

# ── v13 S3-a：constitution 运行时读文件（锁死 v11.4 式回归） ─────
# 2026-09-30 锚点同步（traecode）：第 2 环原锚定 loop.rs 的 `constitution::constitution_prompt()`
# ——该调用点已随 hearth-slim S3（c343031 §二.1）**有意移除**：宪法全文出注入层（3.5K→0，
# 真机实证为 prompt 肥胖元凶），语义降级为投影层保留，**constitution.rs 模块本体保留**。
# 故第 1 环（运行时读 constitution.md）原样保留，第 2 环改锚模块本体的函数签名，
# claim 据实收窄——不再声称"仍注入 build_messages"（那已不成立）。
[[capability]]
id = "constitution-reads-file"
claim = "宪法从 constitution.md 运行时读取（读取函数在位；注入 system prompt 已随 hearth-slim S3 退役）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/constitution.rs"
# 2026-10-01 锚点同步（D-75）：运行时读文件的**机制**从无界 `std::fs::read_to_string`
# 换成共享有界原语 `bounded_io::read_file_text_capped_std`（本仓唯一读文件实现，
# D-33 收敛口径）——能力（"运行时读 constitution.md"）不变，只是实现换底。
all = ["read_file_text_capped_std", "constitution.md"]
meaning = "运行时文件读取逻辑存在（constitution.rs:56 load_constitution_file；已改为有界读入）"

[[capability.chain]]
file = "crates/agent-core/src/constitution.rs"
any = ["pub fn constitution_prompt() -> String {"]
meaning = "运行时读文件函数本体仍在（constitution.rs:35）；注入 prompt 的调用点已删"

# ── v13 S3-b：civ 自动写入（清掉'从未接线'的五版旧债） ───────────
# D-48（2026-10-01 重接线）：原 claim 引用的 do_reflect/do_observe 相位已随线C手术
# 删除；旧锚点 `self.civ_writer` 命中的是**赋值语句**（`self.civ_writer = Some(...)`）
# → 字段"只写不读"，门禁假绿。现改为锚定真实的唯一生产接线点：run() 收尾单点经
# `note_civ_outcome` **读取** civ_writer 字段并 append。
[[capability]]
id = "civ-auto-written"
claim = "run() 收尾自动写文明线（CivWriter 全链接通；D-48 重接线）"
severity = "red"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
all = ["pub trait CivWriter", "fn note_civ_outcome", "self.civ_writer.as_ref()"]
meaning = "trait 定义 + 唯一消费方法（真读字段，非赋值）"

[[capability.chain]]
file = "crates/agent-core/src/loop.rs"
any = ["self.note_civ_outcome(&goal_text, &report)"]
meaning = "run() 收尾单点调用（删此行 = 能力再次断线）"

# D-109（2026-10-02, traecode）：注入点由 `set_civ_writer`（单个全局 writer，写全局档 ⇒
# API 不可见）改为 `set_civ_writer_factory`（按归属用户构造 writer）——使 agent-loop 的
# civ 自动写入落到该用户的可见档（`per_user.civ_for(uid)`），与 API 读侧同一个文件。
[[capability.chain]]
file = "crates/agent-runtime/src/session.rs"
any = ["set_civ_writer_factory("]
meaning = "SessionManager 按 owner 构造并注入每个 AgentLoop（D-109）"

[[capability.chain]]
file = "crates/service/src/main.rs"
all = ["CivWriterAdapter", "set_civ_writer_factory("]
meaning = "组合根按 owner 把文明线适配到 per-user 档（D-109）"

