<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .calc {
      background: #16213e;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: 320px;
    }
    #result {
      width: 100%;
      height: 60px;
      background: #0f3460;
      border: none;
      border-radius: 8px;
      color: #e2e2e2;
      font-size: 28px;
      text-align: right;
      padding: 0 16px;
      margin-bottom: 16px;
      outline: none;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 56px;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    button:active { transform: scale(0.95); }
    .num { background: #1a1a40; color: #fff; }
    .num:hover { opacity: 0.85; }
    .op { background: #e94560; color: #fff; }
    .op:hover { opacity: 0.85; }
    .clear { background: #533483; color: #fff; }
    .clear:hover { opacity: 0.85; }
    .equal { background: #0f3460; color: #53d769; grid-column: span 2; }
    .equal:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="calc">
    <input type="text" id="result" readonly placeholder="0">
    <div class="buttons">
      <button class="clear" onclick="clearAll()">C</button>
      <button class="op"  onclick="appendOp('+')">+</button>
      <button class="op"  onclick="appendOp('-')">−</button>
      <button class="op"  onclick="appendOp('*')">×</button>
      <button class="op"  onclick="appendOp('/')">÷</button>
      <button class="num" onclick="appendNum('7')">7</button>
      <button class="num" onclick="appendNum('8')">8</button>
      <button class="num" onclick="appendNum('9')">9</button>
      <button class="num" onclick="appendNum('4')">4</button>
      <button class="num" onclick="appendNum('5')">5</button>
      <button class="num" onclick="appendNum('6')">6</button>
      <button class="num" onclick="appendNum('1')">1</button>
      <button class="num" onclick="appendNum('2')">2</button>
      <button class="num" onclick="appendNum('3')">3</button>
      <button class="num" onclick="appendNum('0')">0</button>
      <button class="num" onclick="appendNum('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    const resultEl = document.getElementById('result');
    let expression = '';

    function appendNum(n) {
      expression += n;
      resultEl.value = expression;
    }

    function appendOp(op) {
      if (expression === '') return;
      const last = expression.slice(-1);
      if (['+','-','*','/'].includes(last)) {
        expression = expression.slice(0, -1) + op;
      } else {
        expression += op;
      }
      resultEl.value = expression;
    }

    function clearAll() {
      expression = '';
      resultEl.value = '';
    }

    function calculate() {
      if (expression === '') return;
      try {
        if (!/^[\d+\-*/.()\s]+$/.test(expression)) throw new Error('Invalid');
        const val = Function('"use strict"; return (' + expression + ')')();
        if (!isFinite(val)) throw new Error();
        resultEl.value = String(val);
        expression = String(val);
      } catch (e) {
        resultEl.value = '错误';
        expression = '';
      }
    }
  </script>
</body>
</html>
