# WP-6 (v23 phase4): Observer 规则表——阈值配置（Metrics → Finding）
# 确定性：规则按数组顺序遍历；evidence 由引擎格式化（凭值可复现）。

# D-219（2026-10-08, traecode）：本规则**已接线、生产可达**——内核 `Done` 事件现统一携带
# 资源事实（`usage` = 真实 `CostEntry`；`cost_usd` = 可空 USD，未定价 = `null`）。
# `cost_per_step` 为 `None`（**未知**：无用量或成本未定价）时本规则**不参与判定**
# （不得拿未知当数值判，同 D-176）。
# 沿革：D-218 曾如实登记"无数据源 ⇒ 恒 0 ⇒ 永不触发"；D-219 收口接线。
# 见 `metrics.rs` 模块头 ④。
[[rules]]
name = "cost_per_step_high"
metric = "cost_per_step"
op = ">"
threshold = 0.05
severity = "warn"
recommendation = "任务成本超预期，检查是否有冗余 LLM 调用"

[[rules]]
name = "autonomy_low"
metric = "autonomy_rate"
op = "<"
threshold = 0.5
severity = "info"
recommendation = "人工介入偏多，考虑增强 Policy 决策覆盖"

[[rules]]
name = "error_rate_high"
metric = "error_rate"
op = ">"
threshold = 0.3
severity = "warn"
recommendation = "错误率过高，检查工具调用参数与相位逻辑"

[[rules]]
name = "retry_storm_high"
metric = "retry_rate"
op = ">"
threshold = 0.8
severity = "critical"
recommendation = "重试风暴——G0 红线，建议熔断停机"

[[rules]]
name = "wait_high"
metric = "wait_ratio"
op = ">"
threshold = 0.5
severity = "info"
recommendation = "等待人工响应占比过高，检查交互是否可自动化"
